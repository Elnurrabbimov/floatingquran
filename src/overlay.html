<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Lateef:wght@400;700&family=Reem+Kufi:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@400;600;700&family=Roboto:wght@400;500;700&family=Montserrat:wght@400;600;700&family=Nunito:wght@400;600;700&family=Merriweather:wght@400;700&family=Noto+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ar-font: "Amiri Quran", "Geeza Pro", serif;
      --tr-font: -apple-system, "Segoe UI", Roboto, sans-serif;
      --ar-size: 40px; --tr-size: 20px;
      --ar-color: #ffffff; --tr-color: #e8eef5; --label-color: #ffffff;
      --tr-weight: 400;
      --bg: rgba(10, 14, 20, 0.55);
      --shadow: 3px; --outline: 0px; --outline-color: #000000;
      --radius: 16px; --pad: 14px; --line: 1.9;
      --opacity: 1;
      --hl-color: #ffd54a;
    }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      user-select: none;
    }
    body { display: flex; align-items: flex-end; justify-content: center; }
    #box {
      max-width: calc(100% - 24px); margin: 12px;
      padding: var(--pad) calc(var(--pad) * 1.7); border-radius: var(--radius);
      background: var(--bg);
      text-align: center;
      transition: opacity .35s ease;
      opacity: 0;
    }
    #box.visible { opacity: var(--opacity); }
    #ar, #tr, #key {
      text-shadow: 0 1px var(--shadow) rgba(0,0,0,.95), 0 0 var(--shadow) rgba(0,0,0,.8);
      -webkit-text-stroke: var(--outline) var(--outline-color);
      paint-order: stroke fill;
    }
    #ar {
      direction: rtl; font-family: var(--ar-font);
      font-size: calc(var(--ar-size) * var(--fit, 1)); line-height: var(--line); color: var(--ar-color);
    }
    #tr {
      font-family: var(--tr-font); font-weight: var(--tr-weight);
      font-size: calc(var(--tr-size) * var(--fit, 1)); line-height: 1.4; color: var(--tr-color);
      /* arabcha oxirgi qatordagi kasralar tarjimaga tegmasin */
      margin-top: calc(var(--ar-size) * var(--fit, 1) * 0.35);
    }
    .tr-line + .tr-line {
      margin-top: 0.45em; padding-top: 0.45em;
      border-top: 1px solid color-mix(in srgb, var(--tr-color) 25%, transparent);
    }
    #key { font-family: var(--tr-font); font-size: 12px; opacity: .6; margin-top: 4px; color: var(--label-color); }
    /* So'zma-so'z bo'yash: har bir so'z ustida bir xil matnli .hl qatlam, clip-path bilan o'ngdan chapga ochiladi */
    .w { display: inline-grid; white-space: nowrap; }
    .w > span { grid-area: 1 / 1; }
    .w .hl {
      color: var(--hl-color);
      text-shadow: none; pointer-events: none;
      clip-path: inset(0 0 0 100%);
    }
    body.nohl .w .hl { display: none; }
    /* Tajvid ranglari — qorong'i fon uchun yorqin, yorug' fon uchun Quran.com ranglari */
    .tj-ham_wasl, .tj-laam_shamsiyah, .tj-slnt { color: #9aa3ad; }
    .tj-madda_normal { color: #6ea8ff; } .tj-madda_permissible { color: #8f9cff; }
    .tj-madda_obligatory { color: #4f8cff; } .tj-madda_necessary { color: #b18cff; }
    .tj-qalaqah { color: #ff5a5f; } .tj-ikhafa_shafawi { color: #ff6ad5; } .tj-ikhafa { color: #d07cff; }
    .tj-idgham_shafawi { color: #7ee05a; } .tj-iqlab { color: #4fd1ff; } .tj-idgham_ghunnah { color: #2ed3a0; }
    .tj-idgham_wo_ghunnah { color: #5bd35b; } .tj-idgham_mutajanisayn, .tj-idgham_mutaqaribayn { color: #b0b0b0; }
    .tj-ghunnah { color: #ffa64d; }
    body.tj-light .tj-ham_wasl, body.tj-light .tj-laam_shamsiyah, body.tj-light .tj-slnt { color: #aaaaaa; }
    body.tj-light .tj-madda_normal { color: #537fff; } body.tj-light .tj-madda_permissible { color: #4050ff; }
    body.tj-light .tj-madda_obligatory { color: #2144c1; } body.tj-light .tj-madda_necessary { color: #000ebc; }
    body.tj-light .tj-qalaqah { color: #dd0008; } body.tj-light .tj-ikhafa_shafawi { color: #d500b7; }
    body.tj-light .tj-ikhafa { color: #9400a8; } body.tj-light .tj-idgham_shafawi { color: #58b800; }
    body.tj-light .tj-iqlab { color: #26bffd; } body.tj-light .tj-idgham_ghunnah { color: #169777; }
    body.tj-light .tj-idgham_wo_ghunnah { color: #169200; } body.tj-light .tj-ghunnah { color: #ff7e1e; }
    .hidden { display: none; }
    body.unlocked #box { outline: 2px dashed #4fc3f7; -webkit-app-region: drag; cursor: move; }
    body.unlocked::before {
      content: "Sudrab joylashtiring · Cmd/Ctrl+Shift+L bilan qulflang";
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%);
      background: #4fc3f7; color: #000; font: 12px -apple-system, sans-serif; padding: 3px 10px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="box">
    <div id="ar"></div>
    <div id="tr"></div>
    <div id="key"></div>
  </div>
  <script>
    const box = document.getElementById('box');
    const ar = document.getElementById('ar');
    const tr = document.getElementById('tr');
    const key = document.getElementById('key');
    let previewing = false;

    // Oyna balandligini matnga moslash; ekranga sig'masa shriftni kichraytirish
    const root = document.documentElement.style;
    const MARGIN = 24; // #box margin (12px yuqori + 12px past)
    let maxH = 0; // main process aytgan maksimal oyna balandligi
    async function refit() {
      if (!maxH) maxH = await window.bridge.fitWindow(0);
      // O'lchash va kichraytirish sinxron — oraliq holat ekranda chizilmaydi
      let fit = 1;
      root.setProperty('--fit', fit);
      let need = box.offsetHeight + MARGIN;
      while (need > maxH && fit > 0.4) {
        fit = +(fit - 0.05).toFixed(2);
        root.setProperty('--fit', fit);
        need = box.offsetHeight + MARGIN;
      }
      // Oyna faqat bir marta o'zgaradi; boshqa ekranga o'tilgan bo'lsa maxH yangilanadi
      const m = await window.bridge.fitWindow(need);
      if (m && m !== maxH) { maxH = m; refit(); }
    }
    document.fonts.addEventListener('loadingdone', () => refit());
    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(refit, 150); });

    // Har bir tarjima alohida qator; dir="auto" — urdu/fors kabi tillar o'ngdan chapga
    function setTranslations(list) {
      tr.replaceChildren(...list.filter(Boolean).map((text) => {
        const d = document.createElement('div');
        d.className = 'tr-line';
        d.dir = 'auto';
        d.textContent = text;
        return d;
      }));
    }

    // --- So'zma-so'z bo'yash ---
    let verseId = 0;     // overlay'da hozir ko'rsatilgan oyat
    let shownId = 0;     // matni DOM'ga chizilgan oyat
    let timing = null;   // { id, segs: [[wordIndex, startMs, endMs], ...] }
    let clock = null;    // { id, t, rate, playing, at }
    let hlEls = [];      // so'z indeksi -> .hl element
    let hlState = [];    // oxirgi qo'llangan holat (keraksiz DOM yozuvlarisiz)
    let rafId = 0;

    let tajweedOn = false;
    let lastVerse = null;

    // "<rule class=ghunnah>نّ</rule>" -> rangli span'lar (innerHTML'siz, faqat matn)
    function fillWord(el, plain, tj) {
      if (!tajweedOn || !tj) { el.textContent = plain; return; }
      const re = /<(rule|tajweed)\s+class=["']?([a-z_]+)["']?>(.*?)<\/\1>/g;
      let last = 0, m;
      while ((m = re.exec(tj))) {
        if (m.index > last) el.append(tj.slice(last, m.index).replace(/<[^>]*>/g, ''));
        const s = document.createElement('span');
        s.className = 'tj tj-' + m[2];
        s.textContent = m[3].replace(/<[^>]*>/g, '');
        el.append(s);
        last = re.lastIndex;
      }
      if (last < tj.length) el.append(tj.slice(last).replace(/<[^>]*>/g, ''));
    }

    function renderArabic(p) {
      lastVerse = p;
      hlEls = []; hlState = [];
      if (!p.words?.length) { ar.textContent = p.arabic || ''; return; }
      const frag = document.createDocumentFragment();
      p.words.forEach((w, i) => {
        if (i) frag.append(' ');
        const s = document.createElement('span');
        s.className = 'w';
        const base = document.createElement('span');
        fillWord(base, w, p.wordsTj?.[i]);
        const hl = document.createElement('span');
        hl.className = 'hl';
        hl.setAttribute('aria-hidden', 'true');
        fillWord(hl, w, p.wordsTj?.[i]);
        s.append(base, hl);
        frag.append(s);
        hlEls.push(hl);
      });
      ar.replaceChildren(frag);
    }

    function clipFor(p) {
      if (p <= 0) return 'inset(0 0 0 100%)';
      if (p >= 1) return 'inset(-60% -20% -60% -20%)';
      // arabcha o'ngdan chapga o'qiladi: chap chegarani asta ochamiz
      return `inset(-60% -20% -60% ${((1 - p) * 100).toFixed(1)}%)`;
    }

    function paint() {
      rafId = 0;
      if (!timing || !clock || timing.id !== shownId || clock.id !== shownId) return;
      const t = clock.t + (clock.playing ? (Date.now() - clock.at) * clock.rate : 0);
      const prog = new Array(hlEls.length).fill(0);
      for (const [w, a, b] of timing.segs) {
        if (w < 0 || w >= prog.length) continue;
        const p = t >= b ? 1 : t <= a ? 0 : (t - a) / Math.max(1, b - a);
        prog[w] = Math.max(prog[w], p);
      }
      // Vaqti berilmagan so'z: keyingi so'z boshlangan bo'lsa, u ham o'qilgan
      let later = 0;
      for (let i = prog.length - 1; i >= 0; i--) {
        if (!timing.has[i]) prog[i] = later > 0 ? 1 : 0;
        later = Math.max(later, prog[i]);
      }
      prog.forEach((p, i) => {
        const v = p <= 0 ? 0 : p >= 1 ? 1 : Math.round(p * 100) / 100;
        if (hlState[i] === v) return;
        hlState[i] = v;
        hlEls[i].style.clipPath = clipFor(v);
      });
      if (clock.playing) rafId = requestAnimationFrame(paint);
    }

    function schedulePaint() {
      if (!rafId) rafId = requestAnimationFrame(paint);
    }

    function resetHighlight() {
      hlState = [];
      hlEls.forEach((el) => (el.style.clipPath = ''));
    }

    window.bridge.onTiming((t) => {
      timing = { ...t, has: [] };
      for (const [w] of t.segs) timing.has[w] = true;
      schedulePaint();
    });
    window.bridge.onClock((c) => {
      // Orqaga qaytilsa (oyatni takrorlash) — bo'yoqni tozalab, qaytadan
      if (clock && c.id === clock.id && c.t < clock.t - 200) resetHighlight();
      clock = c;
      schedulePaint();
    });

    function hexToRgba(hex, a) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
    }

    window.bridge.onVerse((p) => {
      previewing = false;
      if (!p) { box.classList.remove('visible'); return; }
      verseId = p.id;
      box.classList.remove('visible');
      setTimeout(() => {
        if (p.id !== verseId) return; // orada keyingi oyat kelgan
        renderArabic(p);
        shownId = p.id;
        schedulePaint();
        setTranslations(p.translations || [p.translation]);
        key.textContent = p.label || '';
        refit().then(() => box.classList.add('visible'));
      }, 150);
    });

    window.bridge.onStyle((s) => {
      const r = document.documentElement.style;
      const set = (k, v) => r.setProperty(k, v);
      set('--ar-font', `"${s.arFont}", "Amiri Quran", "Geeza Pro", serif`);
      set('--tr-font', s.trFont === 'system' ? '-apple-system, "Segoe UI", Roboto, sans-serif' : `"${s.trFont}", -apple-system, sans-serif`);
      set('--ar-size', s.arSize + 'px');
      set('--tr-size', s.trSize + 'px');
      set('--tr-weight', s.trWeight);
      set('--ar-color', s.arColor);
      set('--tr-color', s.trColor);
      set('--label-color', s.trColor);
      set('--bg', hexToRgba(s.bgColor, s.bgAlpha));
      set('--shadow', s.shadow + 'px');
      set('--outline', s.outline + 'px');
      set('--outline-color', s.outlineColor);
      set('--radius', s.radius + 'px');
      set('--pad', s.pad + 'px');
      set('--line', s.line);
      set('--opacity', s.opacity);
      if (s.hlColor) set('--hl-color', s.hlColor);
      document.body.classList.toggle('nohl', s.wordHl === false);
      // Yorug' fonda Quran.com'ning asl (to'qroq) tajvid ranglari
      const n = parseInt(s.bgColor.slice(1), 16);
      const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      document.body.classList.toggle('tj-light', s.bgAlpha > 0.5 && lum > 0.6);
      if (!!s.tajweed !== tajweedOn) {
        tajweedOn = !!s.tajweed;
        if (lastVerse && lastVerse.id === shownId) { renderArabic(lastVerse); schedulePaint(); }
      }
      ar.classList.toggle('hidden', !s.showArabic);
      tr.classList.toggle('hidden', !s.showTranslation);
      key.classList.toggle('hidden', !s.showLabel);
      refit();

      // Sozlash paytida natijani ko'rish uchun namuna matn
      if (s.preview && !box.classList.contains('visible')) {
        previewing = true;
        ar.textContent = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ';
        setTranslations(['Mehribon va rahmli Allohning nomi bilan boshlayman.']);
        key.textContent = 'Namuna';
        refit();
        box.classList.add('visible');
        clearTimeout(window._pv);
        window._pv = setTimeout(() => { if (previewing) box.classList.remove('visible'); }, 4000);
      } else if (s.preview && previewing) {
        clearTimeout(window._pv);
        window._pv = setTimeout(() => { if (previewing) box.classList.remove('visible'); }, 4000);
      }
    });

    window.bridge.onLocked((locked) => {
      document.body.classList.toggle('unlocked', !locked);
      if (!locked && !box.classList.contains('visible')) {
        ar.textContent = 'بِسْمِ ٱللَّهِ';
        setTranslations(['Namuna matn']);
        refit();
        box.classList.add('visible');
      }
    });
  </script>
</body>
</html>
