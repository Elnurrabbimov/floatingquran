<!doctype html>
<!-- App ikonkasi manbasi. PNG'ga aylantirish: npx electron scripts/make-icons.js -->
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=block" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: transparent; }
    svg { display: block; }
  </style>
</head>
<body>
  <svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#14735f" />
        <stop offset="1" stop-color="#062a24" />
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
        <stop offset="0" stop-color="#3fd1a8" stop-opacity="0.35" />
        <stop offset="1" stop-color="#3fd1a8" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe7a3" />
        <stop offset="1" stop-color="#d9a43a" />
      </linearGradient>
      <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6dc" />
        <stop offset="1" stop-color="#e9cf8e" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
      </filter>
      <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35" />
      </filter>
    </defs>

    <!-- macOS ikonka to'ri: 824x824 maydon, 100px chekka -->
    <g filter="url(#shadow)">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
    </g>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)" />
    <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" />

    <!-- Suzib turgan subtitle paneli -->
    <g filter="url(#soft)">
      <rect x="196" y="236" width="632" height="214" rx="107" fill="#04201b" fill-opacity="0.55" />
      <rect x="196" y="236" width="632" height="214" rx="107" fill="none" stroke="url(#gold)" stroke-opacity="0.75" stroke-width="5" />
    </g>
    <text x="512" y="398" text-anchor="middle" font-family="Amiri Quran" font-size="112" fill="url(#gold)" direction="rtl">ٱقْرَأْ</text>

    <!-- Ochiq kitob -->
    <g filter="url(#soft)">
      <path d="M512 612 C 452 572, 344 560, 248 586 L 248 770 C 344 746, 452 756, 512 798 Z" fill="url(#page)" />
      <path d="M512 612 C 572 572, 680 560, 776 586 L 776 770 C 680 746, 572 756, 512 798 Z" fill="url(#page)" />
      <path d="M512 612 L 512 798" stroke="#b8862c" stroke-width="6" stroke-linecap="round" />
      <path d="M248 770 C 344 746, 452 756, 512 798 C 572 756, 680 746, 776 770 L 776 790 C 680 768, 572 778, 512 820 C 452 778, 344 768, 248 790 Z" fill="url(#gold)" />
    </g>
    <g stroke="#c9a14f" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M300 640 C 360 626, 420 630, 472 650" />
      <path d="M300 682 C 360 668, 420 672, 472 692" />
      <path d="M300 724 C 360 710, 420 714, 472 734" />
      <path d="M552 650 C 604 630, 664 626, 724 640" />
      <path d="M552 692 C 604 672, 664 668, 724 682" />
      <path d="M552 734 C 604 714, 664 710, 724 724" />
    </g>

    <!-- Kitobdan subtitlega ko'tarilayotgan nuqtalar -->
    <g fill="url(#gold)">
      <circle cx="512" cy="540" r="11" opacity="0.9" />
      <circle cx="512" cy="500" r="7" opacity="0.6" />
    </g>
  </svg>

  <!-- Menu bar (tray) ikonkasi: monoxrom "Template" rasm, macOS rangini o'zi moslaydi -->
  <svg id="tray" width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="margin-top:8px">
    <rect x="4" y="3.5" width="24" height="9" rx="4.5" fill="none" stroke="#000" stroke-width="2.2" />
    <rect x="9" y="7" width="14" height="2.2" rx="1.1" fill="#000" />
    <path d="M16 18 C 13 16, 8 15.5, 4 16.5 L 4 27 C 8 26, 13 26.5, 16 28.5 C 19 26.5, 24 26, 28 27 L 28 16.5 C 24 15.5, 19 16, 16 18 Z" fill="#000" />
    <path d="M16 18.5 L 16 28" stroke="#fff" stroke-width="1.4" />
  </svg>
</body>
</html>
